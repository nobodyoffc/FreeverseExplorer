<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Freeverse</title>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../images/icons/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../constants/strings.js"></script>
</head>
<body>
    <div id="loading">Loading...</div>
    
    <script>
        // Extract address from URL path and redirect to cid-detail.html
        (function() {
            const path = window.location.pathname;
            const addressMatch = path.match(/\/address\/(.+)/);
            
            if (addressMatch && addressMatch[1]) {
                const address = addressMatch[1];
                // Redirect to cid-detail.html with the address as id parameter
                window.location.href = `/html/cid-detail.html?id=${encodeURIComponent(address)}`;
            } else {
                // If no address found, redirect to home page
                window.location.href = '/';
            }
        })();
    </script>
</body>
</html>
