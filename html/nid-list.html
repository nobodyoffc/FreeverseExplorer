<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Freeverse</title>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../images/icons/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../constants/strings.js"></script>
    <script src="../modules/api.js"></script>
</head>
<body>
    <main>
        <div class="title-section">
            <h2><span data-string-key="nid">NID</span></h2>
            <div class="description en" style="display: inline-block;">NID (Named Identity) is named by a subject ID for a object ID.</div>
            <div class="description zh" style="display: none;">NID(Named Identity)是由一个主体身份给一个客体身份的命名。</div>
        </div>
        <section id="nid-list" class="section active">
            <div class="table-container">
                <table id="nid-table" class="list-table">
                    <thead>
                        <tr id="nid-table-header">
                            <!-- Headers will be populated by JavaScript -->
                        </tr>
                    </thead>
                    <tbody id="nid-table-body">
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prev-btn" disabled data-string-key="previous">...</button>
                <span id="page-info">...</span>
                <button id="next-btn" disabled data-string-key="next">...</button>
            </div>
        </section>
    </main>

    <footer>
        <p>...</p>
    </footer>

    <script src="../modules/LoadingOverlay.js"></script>
    <script type="module" src="../entity/Nid.js"></script>
    <script type="module" src="../modules/nid-list.js"></script>
    <script type="module">
        import Header from '../modules/Header.js';
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', () => {
            Header.init();
        });
    </script>
</body>
</html>
