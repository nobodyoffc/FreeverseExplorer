<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeverse</title>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../images/icons/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../constants/strings.js"></script>
    <script src="../modules/api.js"></script>
    <link rel="stylesheet" href="../css/encrypt.css">
</head>
<body data-disable-header-search="true">
    <main>
        <div class="title-section">
            <h2><span data-string-key="encrypt"></span></h2>
            <div class="description"></div>
            <hr class="title-divider">
        </div>

        <!-- Pubkey Input Container -->
        <div class="container pubkey-input-container">
            <h2 class="container-title" data-string-key="pubkey"></h2>
            <div class="pubkey-input-group">
                <input type="text" id="pubkey-input" placeholder="" data-string-key="enterPubkey">
                <button id="pubkey-confirm-btn" class="confirm-btn" data-string-key="confirm"></button>
            </div>
            <div id="fid-dropdown" class="fid-dropdown"></div>
        </div>

        <!-- Plaintext Input Container -->
        <div class="container plaintext-input-container">
            <h2 class="container-title" data-string-key="plaintext"></h2>
            <textarea id="plaintext-input" placeholder=""></textarea>
        </div>

        <!-- Cipher Container -->
        <div class="container cipher-container">
            <h2 class="container-title" data-string-key="cipher"></h2>
            <div id="cipher-content" class="cipher-content"></div>
        </div>

        <!-- Button Container -->
        <div class="container button-container">
            <button id="clear-btn" class="action-btn" data-string-key="clear"></button>
            <button id="copy-btn" class="action-btn" data-string-key="copy"></button>
            <button id="encrypt-btn" class="action-btn" data-string-key="encryptButton"></button>
        </div>
    </main>

    <footer>
        <p>...</p>
    </footer>

    <script type="module" src="../modules/encrypt.js"></script>
    <script type="module">
        import Header from '../modules/Header.js';
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', () => {
            Header.init();
        });
    </script>
</body>
</html>
