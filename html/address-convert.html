<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeverse</title>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../images/icons/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../constants/strings.js"></script>
    <script src="../modules/api.js"></script>
    <link rel="stylesheet" href="../css/addressConvert.css">
</head>
<body data-disable-header-search="true">
    <main>
        <div class="title-section">
            <h2><span data-string-key="addressConvert"></span></h2>
            <div class="description"></div>
            <hr class="title-divider">
        </div>

        <!-- Address Input Container -->
        <div class="container address-input-container">
            <h2 class="container-title" data-string-key="addressOrPubkey"></h2>
            <div class="address-input-group">
                <input type="text" id="address-input" placeholder="" data-string-key="enterAddressOrPubkey">
                <button id="address-confirm-btn" class="confirm-btn" data-string-key="confirm"></button>
            </div>
            <div id="fid-dropdown" class="fid-dropdown"></div>
        </div>

        <!-- Result Container -->
        <div class="container result-container">
            <h2 class="container-title" data-string-key="result"></h2>
            <div id="result-content" class="result-content"></div>
        </div>

        <!-- Button Container -->
        <div class="container button-container">
            <button id="clear-btn" class="action-btn" data-string-key="clear"></button>
            <button id="copy-btn" class="action-btn" data-string-key="copy"></button>
            <button id="convert-btn" class="action-btn" data-string-key="convert"></button>
        </div>
    </main>

    <footer>
        <p>...</p>
    </footer>

    <script type="module" src="../modules/addressConvert.js"></script>
    <script type="module">
        import Header from '../modules/Header.js';
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', () => {
            Header.init();
        });
    </script>
</body>
</html>
