<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeverse</title>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="../images/icons/favicon.ico">
    <link rel="apple-touch-icon" href="../images/icons/favicon.ico">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../constants/strings.js"></script>
</head>
<body>
    <main>
        <div class="title-section">
            <h2><span data-string-key="fieldNames.essayList">Essay List</span></h2>
            <div class="description en" style="display: inline-block;"></div>
            <div class="description zh" style="display: none;"></div>
        </div>
        <section id="essay-list" class="section active">
            <div class="table-container">
                <table>
                    <thead>
                        <tr id="essay-table-header">
                            <!-- Table headers will be populated by JavaScript -->
                        </tr>
                    </thead>
                    <tbody id="essay-table-body">
                        <!-- Table body will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="prev-btn" disabled>Previous</button>
                <span id="page-info">Page 1 of 1</span>
                <button id="next-btn" disabled>Next</button>
            </div>
        </section>
    </main>

    <footer>
        <p>...</p>
    </footer>

    <script type="module" src="../modules/api.js"></script>
    <script type="module" src="../entity/Essay.js"></script>
    <script type="module" src="../modules/essay-list.js"></script>
    <script type="module">
        import Header from '../modules/Header.js';
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', () => {
            Header.init();
        });
    </script>
</body>
</html>
